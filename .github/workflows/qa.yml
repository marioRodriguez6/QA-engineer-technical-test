name: QA Technical Assessment

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      llm_provider:
        description: Provider for all three LLM roles
        type: choice
        options: [groq, anthropic]
        default: groq
        required: true

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Validate evaluator schema and metrics without provider calls
        run: npm run test:evaluator

      - name: Check CI runner syntax
        run: node --check exercise-4-cicd/run-llm-ci.mjs

      - name: Test consolidated report generator
        run: node --test exercise-5-consolidated-report/generate-report.test.mjs exercise-5-consolidated-report/publish-reports.test.mjs

  playwright:
    name: Playwright - ${{ matrix.suite }}
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            test_path: exercise-2-api-testing/tests/status.spec.ts
            evidence_path: output/ci/api/

          - suite: chatbot-docs
            test_path: exercise-3-chatbot-testing/tests/botpress-docs/
            evidence_path: output/chatbot/

          - suite: chatbot-homepage
            test_path: exercise-3-chatbot-testing/tests/botpress-homepage/
            evidence_path: output/ci/chatbot-homepage/

    env:
      QA_REPORT_DIR: output/ci/${{ matrix.suite }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Remove previous suite evidence
        id: clean_evidence
        run: |
          node --input-type=module <<'NODE'
          import { rmSync } from 'node:fs';
          rmSync(process.env.QA_REPORT_DIR, { recursive: true, force: true });
          if (process.env.QA_REPORT_DIR.endsWith('/chatbot-docs')) {
            for (const path of [
              'output/chatbot/chatbot-conversation.png',
              'output/chatbot/chatbot-response-time.json',
            ]) rmSync(path, { force: true });
          }
          NODE

      - run: npm ci

      - name: Install Chromium
        if: startsWith(matrix.suite, 'chatbot-')
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test "${{ matrix.test_path }}"

      - name: Upload reports and evidence
        if: always() && steps.clean_evidence.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: qa-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/${{ matrix.suite }}/
            ${{ matrix.evidence_path }}
          if-no-files-found: warn
          retention-days: 30

  llm:
    name: LLM - five sequential scenarios
    needs: typecheck

    # Los PR de forks no reciben el secret de Groq.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      SIMULATED_USER_PROVIDER: ${{ inputs.llm_provider || 'groq' }}
      SIMULATED_USER_MODEL: ${{ inputs.llm_provider == 'anthropic' && 'claude-haiku-5-5' || 'qwen/qwen3.8-27b' }}

      ASSISTANT_PROVIDER: ${{ inputs.llm_provider || 'groq' }}
      ASSISTANT_MODEL: ${{ inputs.llm_provider == 'anthropic' && 'claude-haiku-5-5' || 'qwen/qwen3.8-27b' }}

      EVALUATOR_PROVIDER: ${{ inputs.llm_provider || 'groq' }}
      EVALUATOR_MODEL: ${{ inputs.llm_provider == 'anthropic' && 'claude-haiku-5-5' || 'openai/gpt-oss-20b' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Remove previous LLM artifact evidence
        id: clean_evidence
        run: |
          node --input-type=module <<'NODE'
          import { rmSync } from 'node:fs';
          rmSync('output/ci/llm', { recursive: true, force: true });
          NODE

      - run: npm ci

      - name: Validate selected provider secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.ASSISTANT_PROVIDER === 'anthropic' ? 'ANTHROPIC_API_KEY' : 'GROQ_API_KEY';
          if (!process.env[key]?.trim()) {
            console.error(key + ' is missing. LLM execution is blocked.');
            process.exit(1);
          }
          NODE

      - name: Run all five LLM scenarios
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node exercise-4-cicd/run-llm-ci.mjs

      - name: Upload LLM reports and logs
        if: always() && steps.clean_evidence.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: qa-llm-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/llm/
          if-no-files-found: warn
          retention-days: 30

  consolidated:
    name: Exercise 5 - consolidated report
    needs: [typecheck, playwright, llm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: qa-report-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false

    env:
      REPORT_INPUT_DIR: output/ci/consolidated-inputs
      WORKFLOW_NEEDS: ${{ toJSON(needs) }}
      REPORT_BRANCH: ${{ github.head_ref || github.ref_name }}
      REPORT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare isolated report inputs
        id: prepare_report
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, rmSync } from 'node:fs';
          rmSync(process.env.REPORT_INPUT_DIR, { recursive: true, force: true });
          mkdirSync(process.env.REPORT_INPUT_DIR, { recursive: true });
          for (const path of ['output/consolidated-report.md', 'output/consolidated-report.json']) {
            rmSync(path, { force: true });
          }
          NODE

      - name: Download llm evidence
        id: llm
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: qa-llm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_INPUT_DIR }}/llm

      - name: Download api evidence
        id: api
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: qa-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_INPUT_DIR }}/api

      - name: Download chatbot-docs evidence
        id: docs
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: qa-chatbot-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_INPUT_DIR }}/chatbot-docs

      - name: Download chatbot-homepage evidence
        id: homepage
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: qa-chatbot-homepage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_INPUT_DIR }}/chatbot-homepage

      - name: Generate consolidated report
        id: generate_report
        if: always()
        env:
          DOWNLOAD_OUTCOMES: >-
            {"llm":"${{ steps.llm.outcome }}","api":"${{ steps.api.outcome }}","chatbot-docs":"${{ steps.docs.outcome }}","chatbot-homepage":"${{ steps.homepage.outcome }}"}
        run: node exercise-5-consolidated-report/generate-report.mjs "$REPORT_INPUT_DIR" output

      - name: Upload consolidated report
        id: upload_report
        if: always() && steps.prepare_report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: qa-consolidated-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/consolidated-report.md
            output/consolidated-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish report snapshots to the source branch
        if: >-
          always() &&
          steps.upload_report.outcome == 'success' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        run: node exercise-5-consolidated-report/publish-reports.mjs output

