name: QA Technical Assessment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Check CI runner syntax
        run: node --check exercise-4-cicd/run-llm-ci.mjs

      - name: Test consolidated report generator
        run: node --test exercise-5-consolidated-report/generate-report.test.mjs

  playwright:
    name: Playwright - ${{ matrix.suite }}
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            test_path: exercise-2-api-testing/tests/status.spec.ts
            evidence_path: output/ci/api/

          - suite: chatbot-docs
            test_path: exercise-3-chatbot-testing/tests/botpress-docs/
            evidence_path: output/chatbot/

          - suite: chatbot-homepage
            test_path: exercise-3-chatbot-testing/tests/botpress-homepage/
            evidence_path: output/ci/chatbot-homepage/

    env:
      QA_REPORT_DIR: output/ci/${{ matrix.suite }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Remove previous suite evidence
        id: clean_evidence
        run: |
          node --input-type=module <<'NODE'
          import { rmSync } from 'node:fs';
          rmSync(process.env.QA_REPORT_DIR, { recursive: true, force: true });
          if (process.env.QA_REPORT_DIR.endsWith('/chatbot-docs')) {
            for (const path of [
              'output/chatbot/chatbot-conversation.png',
              'output/chatbot/chatbot-response-time.json',
            ]) rmSync(path, { force: true });
          }
          NODE

      - run: npm ci

      - name: Install Chromium
        if: startsWith(matrix.suite, 'chatbot-')
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test "${{ matrix.test_path }}"

      - name: Upload reports and evidence
        if: always() && steps.clean_evidence.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: qa-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/${{ matrix.suite }}/
            ${{ matrix.evidence_path }}
          if-no-files-found: warn
          retention-days: 30

  llm:
    name: LLM - five sequential scenarios
    needs: typecheck

    # Los PR de forks no reciben el secret de Groq.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      SIMULATED_USER_PROVIDER: groq
      SIMULATED_USER_MODEL: qwen/qwen3.8-27b

      ASSISTANT_PROVIDER: groq
      ASSISTANT_MODEL: qwen/qwen3.8-27b

      EVALUATOR_PROVIDER: groq
      EVALUATOR_MODEL: openai/gpt-oss-20b

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Remove previous LLM artifact evidence
        id: clean_evidence
        run: |
          node --input-type=module <<'NODE'
          import { rmSync } from 'node:fs';
          rmSync('output/ci/llm', { recursive: true, force: true });
          NODE

      - run: npm ci

      - name: Validate Groq secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is missing. LLM execution is blocked."
            exit 1
          fi

      - name: Run all five LLM scenarios
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node exercise-4-cicd/run-llm-ci.mjs

      - name: Upload LLM reports and logs
        if: always() && steps.clean_evidence.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: qa-llm-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/llm/
          if-no-files-found: warn
          retention-days: 30

  consolidated:
    name: Exercise 5 - consolidated report
    needs: [typecheck, playwright, llm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      REPORT_INPUT_DIR: ${{ runner.temp }}/consolidated-inputs
      WORKFLOW_NEEDS: ${{ toJSON(needs) }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare isolated report inputs
        id: prepare_report
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, rmSync } from 'node:fs';
          rmSync(process.env.REPORT_INPUT_DIR, { recursive: true, force: true });
          mkdirSync(process.env.REPORT_INPUT_DIR, { recursive: true });
          for (const path of ['output/consolidated-report.md', 'output/consolidated-report.json']) {
            rmSync(path, { force: true });
          }
          NODE

      - name: Download llm evidence
        id: llm
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: qa-llm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_INPUT_DIR }}/llm

      - name: Download api evidence
        id: api
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: qa-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_INPUT_DIR }}/api

      - name: Download chatbot-docs evidence
        id: docs
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: qa-chatbot-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_INPUT_DIR }}/chatbot-docs

      - name: Download chatbot-homepage evidence
        id: homepage
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: qa-chatbot-homepage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_INPUT_DIR }}/chatbot-homepage

      - name: Generate consolidated report
        if: always()
        env:
          DOWNLOAD_OUTCOMES: >-
            {"llm":"${{ steps.llm.outcome }}","api":"${{ steps.api.outcome }}","chatbot-docs":"${{ steps.docs.outcome }}","chatbot-homepage":"${{ steps.homepage.outcome }}"}
        run: node exercise-5-consolidated-report/generate-report.mjs "$REPORT_INPUT_DIR" output

      - name: Upload consolidated report
        if: always() && steps.prepare_report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: qa-consolidated-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/consolidated-report.md
            output/consolidated-report.json
          if-no-files-found: error
          retention-days: 30
