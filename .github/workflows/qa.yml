name: QA Technical Assessment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Check CI runner syntax
        run: node --check exercise-4-cicd/run-llm-ci.mjs

  playwright:
    name: Playwright - ${{ matrix.suite }}
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            test_path: exercise-2-api-testing/tests/status.spec.ts
            evidence_path: output/ci/api/

          - suite: chatbot
            test_path: exercise-3-chatbot-testing/tests/
            evidence_path: output/chatbot/

    env:
      QA_REPORT_DIR: output/ci/${{ matrix.suite }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Chromium
        if: matrix.suite == 'chatbot'
        run: npx playwright install --with-deps chromium

      - name: Remove previous chatbot evidence
        if: matrix.suite == 'chatbot'
        run: |
          node --input-type=module <<'NODE'
          import { rmSync } from 'node:fs';

          for (const path of [
            'output/chatbot/chatbot-conversation.png',
            'output/chatbot/chatbot-response-time.json',
          ]) {
            rmSync(path, { force: true });
          }
          NODE

      - name: Run tests
        run: npx playwright test "${{ matrix.test_path }}"

      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/${{ matrix.suite }}/
            ${{ matrix.evidence_path }}
          if-no-files-found: warn
          retention-days: 30

  llm:
    name: LLM - five sequential scenarios
    needs: typecheck

    # Los PR de forks no reciben el secret de Groq.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      SIMULATED_USER_PROVIDER: groq
      SIMULATED_USER_MODEL: qwen/qwen3.8-27b

      ASSISTANT_PROVIDER: groq
      ASSISTANT_MODEL: qwen/qwen3.8-27b

      EVALUATOR_PROVIDER: groq
      EVALUATOR_MODEL: openai/gpt-oss-20b

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Validate Groq secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is missing. LLM execution is blocked."
            exit 1
          fi

      - name: Run all five LLM scenarios
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node exercise-4-cicd/run-llm-ci.mjs

      - name: Upload LLM reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-llm-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/llm/
          if-no-files-found: warn
          retention-days: 30
